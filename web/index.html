<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#081321"><title>Training Navigator</title><link rel="stylesheet" href="app.css"></head>
<body><header class="hero"><p class="eyebrow">PRIVATE TAILNET MEDIA BROWSER</p><h1>Training Navigator</h1><p id="status" class="status" role="status">Loading local drives…</p></header>
<main><section class="nav-bar" aria-label="Folder navigation"><button id="home" type="button">All drives</button><button id="back" type="button" disabled>Back</button><nav id="breadcrumbs" aria-label="Breadcrumb"></nav></section>
<section id="home-view"><div class="home-heading"><div><p class="eyebrow">START HERE</p><h2>Choose a local drive or open your Training Library</h2></div><button id="refresh-drives" type="button">Refresh</button></div><button id="training-shortcut" class="training-shortcut" type="button"><span>★</span><span><strong>Training Library</strong><small id="training-path"></small></span></button><div id="drive-grid" class="drive-grid" aria-live="polite"></div></section>
<section id="browser-view" hidden><div class="toolbar"><label class="search-label" for="search">Search this folder</label><input id="search" type="search" placeholder="Filter this folder" autocomplete="off"><label class="sort-label" for="sort">Sort</label><select id="sort" aria-label="Sort this folder"><option value="kind">Sort: kind</option><option value="name">Sort: name</option><option value="modified">Sort: recently changed</option><option value="size">Sort: size</option></select><button id="refresh-folder" type="button">Refresh folder</button></div><p id="folder-summary" class="folder-summary"></p><p id="empty" class="empty" hidden>This folder has no matching visible items.</p><section id="preview" class="preview" hidden aria-live="polite"><div class="preview-header"><h2 id="preview-title">Preview</h2><button id="close-preview" type="button">Close</button></div><div id="viewer" class="viewer"></div></section><section id="catalog" class="catalog" aria-live="polite"></section></section></main><script src="app.js"></script></body></html>
